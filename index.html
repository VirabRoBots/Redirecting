<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <script>
    const tg = window.Telegram.WebApp;
    const data = window.location.search.substring(1);
    
    if (data) {
        tg.sendData(data);
        tg.close();
    }
</script>
</body>
</html>
