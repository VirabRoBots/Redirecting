<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 360px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }

        .loader {
            width: 50px;
            height: 50px;
            margin: 0 auto 25px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #00ffcc;
            border-right: 3px solid #00ffcc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .bot-name {
            color: #00ffcc;
            font-weight: 500;
            background: rgba(0, 255, 204, 0.1);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            margin-top: 15px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        function closePage() {
            window.close();
        }
        
        function isTelegramWebView() {
            return navigator.userAgent.includes('Telegram') || 
                   window.TelegramWebviewProxy !== undefined ||
                   window.location.href.includes('tgWebView');
        }
        
        const data = window.location.search.substring(1);
        
        if (data) {
            setTimeout(() => {
                if (isTelegramWebView()) {
                    window.location.href = "tg://resolve?domain=Moviesearcherxyzbot&start=" + data;
                    setTimeout(() => {
                        closePage();
                    }, 500);
                } else {
                    window.location.href = "https://telegram.me/Moviesearcherxyzbot?start=" + data;
                }
            }, 1500);
        }
    </script>
</head>
<body>
    <div class="card">
        <div class="loader"></div>
        <h1>Redirecting...</h1>
        <p>Please Wait While We Redirect To Telegram (If Not Redirected Click Close Button Below)</p>
        <div class="bot-name">⚡ MoviesearcherXYZBot</div>
        <button class="close-btn" onclick="closePage()">✕ Close This Page</button>
    </div>
</body>
</html>
