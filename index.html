<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Bot...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: system-ui;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
        }
        .loader {
            width: 45px;
            height: 45px;
            margin: 0 auto 20px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid #00ffcc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { color: white; font-size: 22px; margin-bottom: 10px; }
        p { color: rgba(255,255,255,0.7); font-size: 14px; }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #00ffcc, #0099ff);
            padding: 12px 28px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="loader"></div>
        <h1>Redirecting...</h1>
        <p>Opening bot in Telegram</p>
        <a href="#" class="btn" id="manualBtn">Open Bot</a>
    </div>

    <script>
        const queryString = window.location.search.substring(1);
        const botLink = `tg://resolve?domain=Moviesearcherxyzbot&start=${queryString}`;
        
        document.getElementById('manualBtn').href = botLink;
        
        // Try automatic redirect
        if (queryString) {
            setTimeout(() => {
                window.location.href = botLink;
            }, 1000);
        }
    </script>
</body>
</html>
