<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a2e;
            font-family: system-ui;
            color: white;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid #00ffcc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div style="text-align: center">
        <div class="loader"></div>
        <p>Processing...</p>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // Get start_param from the Mini App initialization
        const startParam = tg.initDataUnsafe?.start_param;
        
        if (startParam) {
            // Send data back to bot
            tg.sendData(JSON.stringify({ start: startParam }));
            // Close the webview automatically
            tg.close();
        } else {
            // Fallback - redirect using tg://
            setTimeout(() => {
                window.location.href = "tg://resolve?domain=Moviesearcherxyzbot&start=" + window.location.search.substring(1);
            }, 1000);
        }
    </script>
</body>
</html>
